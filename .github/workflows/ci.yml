name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Formatter output is version-sensitive, so every job that gates on
# formatting pins its toolchain rather than tracking `stable`. Jobs that
# only build, analyze, or test still float, so genuine breakage against new
# SDKs surfaces here rather than in a user's project.
env:
  DART_SDK_VERSION: '3.13.0'
  FLUTTER_VERSION: '3.47.0'

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, not `stable`. dart format output changes between SDK
      # releases (3.13 collapses some call arguments differently than
      # 3.12), so a floating SDK turns this job red on an unrelated commit
      # the day a new stable ships. Keep in sync with DART_SDK_VERSION in
      # scripts/format.sh.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}
      - run: dart pub get
      # The file list lives in scripts/format.sh so developers and CI check
      # exactly the same set. The Flutter sub-package under
      # example/flathub_catalog/ is excluded there and covered by the
      # flutter-flathub-catalog job below instead.
      - run: scripts/format.sh --check --dart

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze --fatal-infos

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libsqlite3-dev pkg-config
      - run: dart pub get
      # The Dart test suite triggers hook/build.dart, which drives CMake
      # to compile libappstream.so before the FFI tests load it.
      - run: dart test

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart doc --validate-links

  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No apt install of clang-format here: the runner image's version
      # tracks the Ubuntu release and changes underneath us, and versions
      # disagree on real constructs (18 and 22 format `struct stat sb {}`
      # differently, and 22 flags its own output under --dry-run --Werror).
      # scripts/format.sh provisions the pinned version via pip so a local
      # run and this job reach the same verdict.
      - name: Check formatting
        run: scripts/format.sh --check --cxx

  clang-tidy:
    runs-on: ubuntu-latest
    # No longer advisory. This job was continue-on-error because an
    # unpinned clang-tidy produced results that varied by runner image —
    # including a bugprone-use-after-move false positive on the documented
    # way to restore a moved-from object. scripts/tidy.sh pins the version,
    # which made the job deterministic and clean, so it can now block. It
    # earns that: the pinned checker found an unchecked gmtime_r return that
    # the previously installed version was too degraded to reach.
    steps:
      - uses: actions/checkout@v4
      # No clang-tidy from apt: scripts/tidy.sh provisions the pinned
      # version via pip, so this job and a local run agree.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev pkg-config
      - name: Run clang-tidy
        run: scripts/tidy.sh

  cxx-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        sanitizer: [none, asan, ubsan]
        exclude:
          - build-type: Release
            sanitizer: asan
          - build-type: Release
            sanitizer: ubsan
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libsqlite3-dev libgtest-dev
      - name: Configure
        run: |
          scripts/configure.sh \
            --build-type ${{ matrix.build-type }} \
            --tests ON \
            --sanitizer ${{ matrix.sanitizer }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  flutter-flathub-catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example/flathub_catalog
    steps:
      - uses: actions/checkout@v4
      # Pinned for the same reason as the format job: this job runs
      # `dart format` with the Flutter SDK's bundled formatter, so a
      # floating channel makes formatting a moving target.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libsqlite3-dev pkg-config \
            clang libgtk-3-dev liblzma-dev
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart pub publish --dry-run
